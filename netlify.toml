[build]
  base = "game"
  # The 2D game at /, and the 3D rebuild (game3d/, which imports game/src) at /3d/.
  command = "npm run build && cd ../game3d && npm ci && npx vite build --base=/3d/ --outDir ../game/dist/3d --emptyOutDir"
  publish = "dist"
  # Netlify skips a build when the base directory is unchanged, which skipped every game3d-only
  # change. Build when either game, game3d or this file changed (exit 1 = build).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../game3d ../netlify.toml"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
